[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "company-ai"
version = "0.1.0"
description = "Local proof of concept for governed company AI workflow components."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
live = ["boto3>=1.35,<2"]
dev = ["pytest>=8.3,<9", "boto3>=1.35,<2"]

[project.scripts]
company-ai = "company_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: opt-in live smoke tests; skipped unless COMPANY_AI_LIVE=1",
]
